name: Count Curriculum Chapters

on:
  workflow_dispatch: {}

jobs:
  count-curriculum:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Count Curriculum Chapters
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // GitHub Script automatically exposes: core, github, context
            // ❗ DO NOT redeclare core

            const workspace = process.env.GITHUB_WORKSPACE;

            // Candidate base folders
            const candidates = ['staticcurriculum', 'static_curriculum', 'static-curriculum'];

            let BASE = null;
            for (const c of candidates) {
              const full = path.join(workspace, c);
              if (fs.existsSync(full) && fs.statSync(full).isDirectory()) {
                BASE = full;
                break;
              }
            }

            if (!BASE) {
              core.setFailed(`Could not find curriculum folder. Tried: ${candidates.join(', ')}`);
              return;
            }

            console.log(`\nUsing curriculum base folder: ${BASE}\n`);

            // Detect class folders
            const classDirs = fs.readdirSync(BASE, { withFileTypes: true })
              .filter(d => d.isDirectory() && /^class\d+$/i.test(d.name))
              .map(d => d.name)
              .sort((a,b) => Number(a.replace('class','')) - Number(b.replace('class','')));

            if (!classDirs.length) {
              core.setFailed(`No class directories found inside ${BASE}`);
              return;
            }

            let grandSubjects = 0;
            let grandChapters = 0;

            for (const dirName of classDirs) {
              const classNum = dirName.replace(/class/i, '');
              const curriculumPath = path.join(BASE, dirName, 'curriculum.js');

              if (!fs.existsSync(curriculumPath)) {
                console.log(`⚠ Missing: ${curriculumPath}`);
                continue;
              }

              // Require curriculum file
              let curriculum;
              try {
                delete require.cache[require.resolve(curriculumPath)];
                curriculum = require(curriculumPath);
              } catch (error) {
                console.log(`❌ Error loading ${curriculumPath}: ${error.message}`);
                continue;
              }

              const subjectCount = Array.isArray(curriculum)
                ? curriculum.length
                : 0;

              let chapterCount = 0;

              if (Array.isArray(curriculum)) {
                for (const subject of curriculum) {
                  if (subject && Array.isArray(subject.chapters)) {
                    chapterCount += subject.chapters.length;
                  }
                }
              }

              grandSubjects += subjectCount;
              grandChapters += chapterCount;

              console.log(`\n▶ Class ${classNum}`);
              console.log(`  Subjects       : ${subjectCount}`);
              console.log(`  Chapter Count  : ${chapterCount}`);
              console.log('----------------------------------');
            }

            console.log(`\n📊 GRAND TOTALS`);
            console.log(`  Total Subjects : ${grandSubjects}`);
            console.log(`  Total Chapters : ${grandChapters}\n`);
