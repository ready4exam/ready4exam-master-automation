name: Count Curriculum Chapters

on:
  workflow_dispatch: {}

jobs:
  count-curriculum:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Count chapters (runs JS inside the Action)
        uses: actions/github-script@v6
        with:
          # run the following JavaScript in the runner workspace (no external file needed)
          script: |
            const fs = require('fs');
            const path = require('path');

            // Adjust this if your folder name differs:
            const BASE = path.join(process.env.GITHUB_WORKSPACE || process.cwd(), 'staticcurriculum');

            if (!fs.existsSync(BASE)) {
              core = require('@actions/core');
              console.log(`❌ Base folder not found: ${BASE}`);
              // Fail the step so you can see the error in the UI
              core.setFailed(`Base folder not found: ${BASE}`);
              return;
            }

            console.log('');
            console.log('📘 Curriculum Summary for Class 5–12');
            console.log('--------------------------------------');

            const classes = ['5','6','7','8','9','10','11','12'];

            let grandSubjects = 0;
            let grandChapters = 0;

            for (const cls of classes) {
              const curriculumPath = path.join(BASE, `class${cls}`, 'curriculum.js');

              if (!fs.existsSync(curriculumPath)) {
                console.log(`⚠ Class ${cls}: curriculum.js not found at ${curriculumPath}`);
                continue;
              }

              let curriculum;
              try {
                // require() resolves absolute path fine
                curriculum = require(curriculumPath);
              } catch (err) {
                console.log(`❌ Error loading class ${cls} curriculum: ${err && err.message ? err.message : err}`);
                continue;
              }

              const subjectCount = Array.isArray(curriculum) ? curriculum.length : 0;
              let chapterCount = 0;

              if (Array.isArray(curriculum)) {
                for (const subj of curriculum) {
                  if (subj && Array.isArray(subj.chapters)) chapterCount += subj.chapters.length;
                  // If your structure stores chapters differently, adapt the above line.
                }
              }

              grandSubjects += subjectCount;
              grandChapters += chapterCount;

              console.log('');
              console.log(`▶ Class ${cls}`);
              console.log(`  Subjects      : ${subjectCount}`);
              console.log(`  Total Chapters: ${chapterCount}`);
              console.log('--------------------------------------');
            }

            console.log('');
            console.log('📊 GRAND TOTALS');
            console.log(`  Subjects sum : ${grandSubjects}`);
            console.log(`  Chapters sum : ${grandChapters}`);
            console.log('');
