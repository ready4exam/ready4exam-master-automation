name: Count Curriculum Chapters

on:
  workflow_dispatch: {}

jobs:
  count-curriculum:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Create and run counting script
        run: |
          echo "📘 Curriculum Summary"
          echo "--------------------------------------"
          
          # Use a block literal to ensure the JS code doesn't break YAML syntax
          cat << 'EOF' > count.js
          const fs = require("fs");
          const path = require("path");
          const workspace = process.cwd();
          
          const candidates = ["static_curriculum", "staticcurriculum", "static-curriculum", "data"];
          let BASE = null;

          for (const name of candidates) {
            const full = path.join(workspace, name);
            if (fs.existsSync(full) && fs.statSync(full).isDirectory()) {
              BASE = full;
              break;
            }
          }

          if (!BASE) {
            console.error("❌ Curriculum folder not found.");
            process.exit(1);
          }

          console.log(`Using curriculum folder: ${BASE}`);
          const dirs = fs.readdirSync(BASE)
            .filter(d => /^class\d+$/.test(d))
            .sort((a,b) => Number(a.replace("class","")) - Number(b.replace("class","")));

          let totalSubjects = 0;
          let totalChapters = 0;

          for (const dir of dirs) {
            const classNum = dir.replace("class","");
            const curriculumPath = path.join(BASE, dir, "curriculum.js");
            
            if (!fs.existsSync(curriculumPath)) continue;

            let curriculum;
            try {
              // Read as text to avoid require() issues with non-module files
              const content = fs.readFileSync(curriculumPath, "utf-8");
              // Basic regex to find chapters if exported as a standard object
              const chapterCount = (content.match(/chapter_title/g) || []).length;
              const subjectCount = (content.match(/subject/g) || []).length;

              totalSubjects += subjectCount;
              totalChapters += chapterCount;

              console.log(`▶ Class ${classNum}: ${subjectCount} Subjects, ${chapterCount} Chapters`);
            } catch (err) {
              console.error(`❌ Error reading ${curriculumPath}: ${err.message}`);
            }
          }
          console.log("\n📊 GRAND TOTALS");
          console.log(`  Total Subjects : ${totalSubjects}`);
          console.log(`  Total Chapters : ${totalChapters}`);
          EOF

          node count.js
