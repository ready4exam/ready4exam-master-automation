name: Count Curriculum Chapters

on:
  workflow_dispatch: {}

jobs:
  count-curriculum:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Run chapter count script
        run: node ./scripts/countChapters.js
