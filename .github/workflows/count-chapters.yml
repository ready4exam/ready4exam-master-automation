name: Count Curriculum Chapters

on:
  workflow_dispatch: {}

jobs:
  count-curriculum:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Create and run counting script
        run: |
          echo "📘 Curriculum Summary"
          echo "--------------------------------------"

          # Create a temporary counting script
          cat << 'EOF' > count.js
const fs = require("fs");
const path = require("path");

const workspace = process.cwd();
const candidates = ["staticcurriculum", "static_curriculum", "static-curriculum"];

let BASE = null;

// Detect correct curriculum folder
for (const name of candidates) {
  const full = path.join(workspace, name);
  if (fs.existsSync(full) && fs.statSync(full).isDirectory()) {
    BASE = full;
    break;
  }
}

if (!BASE) {
  console.error("❌ Curriculum folder not found.");
  process.exit(1);
}

console.log(`Using curriculum folder: ${BASE}`);

const dirs = fs.readdirSync(BASE)
  .filter(d => /^class\d+$/.test(d))
  .sort((a,b) => Number(a.replace("class","")) - Number(b.replace("class","")));

let totalSubjects = 0;
let totalChapters = 0;

for (const dir of dirs) {
  const classNum = dir.replace("class","");
  const curriculumPath = path.join(BASE, dir, "curriculum.js");

  if (!fs.existsSync(curriculumPath)) {
    console.log(`⚠ Missing curriculum.js for class ${classNum}`);
    continue;
  }

  let curriculum;
  try {
    curriculum = require(curriculumPath);
  } catch (err) {
    console.error(`❌ Error reading ${curriculumPath}: ${err.message}`);
    continue;
  }

  const subjects = Array.isArray(curriculum) ? curriculum.length : 0;
  let chapters = 0;

  if (Array.isArray(curriculum)) {
    for (const s of curriculum) {
      if (Array.isArray(s.chapters)) chapters += s.chapters.length;
    }
  }

  totalSubjects += subjects;
  totalChapters += chapters;

  console.log(`\n▶ Class ${classNum}`);
  console.log(`  Subjects      : ${subjects}`);
  console.log(`  Chapters      : ${chapters}`);
  console.log("--------------------------------------");
}

console.log("\n📊 GRAND TOTALS");
console.log(`  Total Subjects : ${totalSubjects}`);
console.log(`  Total Chapters : ${totalChapters}`);
console.log("");
EOF

          # Run the script
          node count.js
