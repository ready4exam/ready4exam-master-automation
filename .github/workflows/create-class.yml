name: Create Class Repository

on:
  workflow_dispatch:
    inputs:
      class:
        description: "Class number to generate (e.g., 9, 11, 12)"
        required: true

jobs:
  create-class:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install dependencies
        run: npm install

      # 🚫 IMPORTANT:
      # curriculum.js generation is intentionally NOT part of this workflow
      # Curriculum is injected ONLY if destination repo does not already have it

      - name: 🚀 Run Class Automation
        env:
          CLASS: ${{ github.event.inputs.class }}

          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}

          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

          GIT_OWNER: ${{ secrets.GIT_OWNER }}
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}

        run: node scripts/createClassRepo.js

      - name: ✅ Workflow Complete
        run: echo "🎉 Completed class automation for Class ${{ github.event.inputs.class }}"
