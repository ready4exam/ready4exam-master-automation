name: Create Class Repository

on:
  workflow_dispatch:
    inputs:
      class:
        description: "Class number to generate (e.g., 9, 11, 12)"
        required: true

jobs:
  create-class:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install dependencies
        run: npm install

      # 🧠 STEP 1 — Convert curriculum JSON → JS (before class repo generation)
      - name: 🧠 Generate curriculum.js from JSON
        run: node scripts/generateCurriculumJS.js
        env:
          CLASS: ${{ github.event.inputs.class }}   # ✅ FIX ADDED

      # 🚀 STEP 2 — Create class repository using the specified class input
      - name: 🚀 Run Class Automation
        env:
          CLASS: ${{ github.event.inputs.class }} # (already correct)
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FIREBASE_API_KEY_1112: ${{ secrets.FIREBASE_API_KEY_1112 }}
          FIREBASE_APP_ID_1112: ${{ secrets.FIREBASE_APP_ID_1112 }}
          FIREBASE_PROJECT_ID_1112: ${{ secrets.FIREBASE_PROJECT_ID_1112 }}
          FIREBASE_AUTH_DOMAIN_1112: ${{ secrets.FIREBASE_AUTH_DOMAIN_1112 }}
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: node scripts/createClassRepo.js

      # ✅ STEP 3 — Confirm success
      - name: ✅ Workflow Complete
        run: echo "🎉 Class repository automation complete for Class ${{ github.event.inputs.class }}"
