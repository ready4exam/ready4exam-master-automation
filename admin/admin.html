<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Ready4Exam — Admin Panel</title>

    <style>
        body { font-family: Arial; background: #f0f2f5; margin: 0; }

        #topBar {
            background: #007bff;
            padding: 14px 22px;
            font-size: 22px;
            color: white;
            display: flex;
            justify-content: space-between;
        }

        #logoutBtn {
            padding: 8px 14px;
            background: red;
            border: none;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            display: none;
        }

        #loginScreen, #adminDashboard {
            width: 100%;
            display: none;
            padding-top: 60px;
            text-align: center;
        }

        #googleLoginBtn {
            padding: 12px 20px;
            background: #4285F4;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 20px;
        }

        #userList {
            margin: 30px auto;
            width: 70%;
        }

        .userCard {
            background: white;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            box-shadow: 0 0 6px rgba(0,0,0,0.1);
        }

        .toggleBtn {
            padding: 8px 14px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        #loginError {
            color: red;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<div id="topBar">
    Ready4Exam — Admin Panel
    <button id="logoutBtn">Logout</button>
</div>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
    <h2>Admin Login</h2>
    <button id="googleLoginBtn">Sign in with Google</button>
    <div id="loginError"></div>
</div>

<!-- ADMIN DASHBOARD -->
<div id="adminDashboard">
    <h2>Admin Dashboard</h2>
    <h3>Users</h3>
    <div id="userList"></div>
</div>

<script type="module" src="admin.js"></script>
</body>
</html>
