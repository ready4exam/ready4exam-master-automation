<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ready4Exam — Admin Dashboard</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: { 'cbse-blue': '#1a3e6a', 'accent-gold': '#ffb703' }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="./css/admin.css" />

</head>
<body class="bg-cbse-light min-h-screen">

  <header class="bg-white shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center py-4">
        <div class="flex items-center gap-4">
          <h1 class="text-2xl font-extrabold text-cbse-blue">Ready4Exam <span class="text-accent-gold">Admin</span></h1>
          <span id="current-admin-email" class="text-sm text-gray-600"></span>
        </div>

        <div class="flex items-center gap-3">
          <button id="refresh-btn" class="btn-secondary">Refresh</button>
          <button id="logout-btn" class="btn-ghost">Logout</button>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- Top controls -->
    <section class="bg-white rounded-lg shadow-sm p-4 mb-6">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
        <div>
          <label class="block text-sm font-medium text-gray-700">Search by Email</label>
          <input id="filter-email" type="search" placeholder="user@example.com" class="input" />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700">Filter by Class (paid)</label>
          <select id="filter-class" class="input">
            <option value="">Any</option>
            <option value="6">Class 6</option>
            <option value="7">Class 7</option>
            <option value="8">Class 8</option>
            <option value="9">Class 9</option>
            <option value="10">Class 10</option>
            <option value="11">Class 11</option>
            <option value="12">Class 12</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700">Filter by Stream</label>
          <select id="filter-stream" class="input">
            <option value="">Any</option>
            <option value="science">Science</option>
            <option value="commerce">Commerce</option>
            <option value="arts">Arts</option>
          </select>
        </div>
      </div>

      <div class="flex gap-3 mt-4">
        <button id="apply-filters" class="btn-primary">Apply</button>
        <button id="clear-filters" class="btn-ghost">Clear</button>
        <div class="ml-auto text-sm text-gray-500 self-center">Showing <span id="results-count">0</span> users</div>
      </div>
    </section>

    <!-- Table -->
    <section class="bg-white rounded-lg shadow-sm">
      <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200" id="users-table">
          <thead class="bg-gray-50">
            <tr>
              <th class="px-4 py-3 text-left text-xs font-medium text-gray-500">Email</th>
              <th class="px-4 py-3 text-left text-xs font-medium text-gray-500">Role</th>
              <th class="px-4 py-3 text-left text-xs font-medium text-gray-500">Signup</th>
              <th class="px-4 py-3 text-left text-xs font-medium text-gray-500">Paid Classes</th>
              <th class="px-4 py-3 text-left text-xs font-medium text-gray-500">Streams</th>
              <th class="px-4 py-3 text-left text-xs font-medium text-gray-500">Actions</th>
            </tr>
          </thead>
          <tbody id="users-tbody" class="bg-white divide-y divide-gray-200"></tbody>
        </table>
      </div>

      <div class="p-4 flex items-center justify-between">
        <div class="flex gap-2">
          <button id="prev-page" class="btn-ghost">← Prev</button>
          <button id="next-page" class="btn-ghost">Next →</button>
        </div>

        <div class="text-sm text-gray-600">
          Page size:
          <select id="page-size" class="input-inline">
            <option value="10">10</option>
            <option value="20" selected>20</option>
            <option value="50">50</option>
          </select>
        </div>
      </div>
    </section>
  </main>

  <footer class="text-center text-gray-500 py-6">
    <small>Admin Dashboard — Ready4Exam © 2025</small>
  </footer>

  <script type="module" src="./js/admin.js"></script>
</body>
</html>
