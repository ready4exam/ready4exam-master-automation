<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ready4Exam Admin Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ["Inter", "sans-serif"] },
        }
      }
    }
  </script>
</head>

<body class="bg-gray-100 min-h-screen p-6 font-sans">

  <div class="max-w-5xl mx-auto">

    <!-- HEADER -->
    <div class="bg-white p-5 rounded-lg shadow flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold text-blue-700">Ready4Exam — Admin Panel</h1>
      <button id="logoutBtn" class="px-4 py-2 bg-red-500 text-white rounded">Logout</button>
    </div>

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="text-center mt-20">
      <h2 class="text-xl font-semibold mb-4">Admin Login</h2>
      <button id="googleLoginBtn"
        class="px-5 py-3 bg-blue-600 text-white rounded shadow hover:bg-blue-700">
        Sign in with Google
      </button>
      <p id="loginError" class="mt-3 text-red-600 hidden"></p>
    </div>

    <!-- ADMIN DASHBOARD -->
    <div id="adminDashboard" class="hidden">

      <div class="bg-white p-5 rounded-lg shadow mb-6">
        <h2 class="text-xl font-semibold mb-3 text-gray-700">Registered Users</h2>
        <p class="text-sm mb-4 text-gray-600">Click a user to edit their access.</p>
        <div id="userList" class="space-y-2"></div>
      </div>

      <!-- USER EDIT PANEL -->
      <div id="editPanel" class="hidden bg-white p-6 rounded-lg shadow">
        <h3 class="text-lg font-bold text-blue-700 mb-4">Edit User</h3>

        <p class="mb-2"><strong>Email:</strong> <span id="ep_email"></span></p>
        <p class="mb-4"><strong>Signup Date:</strong> <span id="ep_signup"></span></p>

        <hr class="my-4">

        <h4 class="font-semibold mb-2">Paid Classes</h4>
        <div id="paidClassesBox" class="flex flex-wrap gap-3 mb-4"></div>

        <h4 class="font-semibold mb-2">Streams (Class 11–12)</h4>
        <div class="flex gap-4 mb-4">
          <label><input type="checkbox" id="stream_science"> Science</label>
          <label><input type="checkbox" id="stream_commerce"> Commerce</label>
          <label><input type="checkbox" id="stream_arts"> Arts</label>
        </div>

        <h4 class="font-semibold mb-2">Role</h4>
        <select id="roleSelect" class="border p-2 rounded">
          <option value="student">student</option>
          <option value="school_admin">school_admin</option>
        </select>

        <div class="mt-6 flex gap-4">
          <button id="saveBtn" class="px-4 py-2 bg-green-600 text-white rounded">Save</button>
          <button id="cancelBtn" class="px-4 py-2 bg-gray-400 text-white rounded">Cancel</button>
        </div>
      </div>

    </div>

  </div>

  <script type="module" src="./admin.js"></script>
</body>
</html>
