<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
  <title>Ready4Exam — Admin Dashboard</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme:{
        extend:{
          fontFamily:{sans:['Inter','sans-serif']},
          colors:{'cbse-blue':'#1a3e6a','accent-gold':'#ffb703'}
        }
      }
    }
  </script>

  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
  </style>
</head>

<body class="bg-slate-50 min-h-screen font-sans antialiased text-slate-900">

  <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 bg-cbse-blue rounded-lg flex items-center justify-center">
            <span class="text-white font-black text-xl">R</span>
        </div>
        <h1 class="text-xl font-black text-cbse-blue tracking-tighter uppercase">
            Ready4Exam <span class="text-accent-gold">Control</span>
        </h1>
      </div>
      <div class="flex items-center gap-6">
        <div class="text-right hidden sm:block">
            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Administrator</p>
            <p id="current-admin-email" class="text-sm font-bold text-slate-700"></p>
        </div>
        <button id="logout-btn" class="px-4 py-2 bg-red-50 text-red-600 rounded-xl font-black text-xs uppercase hover:bg-red-100 transition-all border border-red-100">
          Sign Out
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-10">

    <div class="grid grid-cols-1 lg:grid-cols-4 gap-6 mb-10">
        <div class="lg:col-span-3 bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
            <label class="text-[10px] font-black uppercase text-slate-400 mb-2 block tracking-widest">Search Student Records</label>
            <div class="flex gap-3">
                <input id="filter-email" type="text" class="flex-1 bg-slate-50 border border-slate-200 rounded-2xl px-5 py-3 text-sm focus:ring-2 focus:ring-cbse-blue outline-none transition-all" placeholder="Enter student email address...">
                <button id="apply-filters" class="bg-cbse-blue text-white px-8 py-3 rounded-2xl font-bold text-sm shadow-md hover:shadow-lg transition-all">Search</button>
                <button id="clear-filters" class="bg-slate-100 text-slate-600 px-6 py-3 rounded-2xl font-bold text-sm hover:bg-slate-200 transition-all">Reset</button>
            </div>
        </div>
        <div class="bg-cbse-blue p-6 rounded-3xl shadow-xl flex flex-col justify-center border border-cbse-blue">
            <p class="text-blue-200 text-[10px] font-black uppercase tracking-widest mb-1">System Status</p>
            <h3 class="text-white font-black text-2xl" id="results-count">0 Users</h3>
            <button id="refresh-btn" class="text-blue-300 text-xs font-bold mt-2 text-left hover:text-white transition-colors">↻ Force Sync Data</button>
        </div>
    </div>

    <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left">
          <thead class="bg-slate-50 border-b border-slate-100">
            <tr class="text-[10px] font-black uppercase text-slate-400 tracking-widest">
              <th class="px-8 py-5">Identification</th>
              <th class="px-8 py-5">Trial Expiry Control</th>
              <th class="px-8 py-5">Paid Class Access</th>
              <th class="px-8 py-5">Stream Assignment</th>
              <th class="px-8 py-5 text-right">System Actions</th>
            </tr>
          </thead>
          <tbody id="users-tbody" class="divide-y divide-slate-50">
            </tbody>
        </table>
      </div>
      
      <div id="empty-state" class="hidden py-20 text-center">
          <div class="text-slate-300 mb-4">
              <svg class="w-16 h-16 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
          </div>
          <p class="text-slate-500 font-bold">No students found matching your search.</p>
      </div>
    </div>

  </main>

  <footer class="max-w-7xl mx-auto px-6 py-10 flex flex-col md:flex-row justify-between items-center text-slate-400 border-t border-slate-200 mt-10">
    <p class="text-[10px] font-black uppercase tracking-widest">Ready4Exam Internal Infrastructure v2.0</p>
    <p class="text-[10px] font-black uppercase tracking-widest mt-4 md:mt-0">© 2025 Production Environment</p>
  </footer>

  <script type="module" src="./admin.js"></script>
</body>
</html>
