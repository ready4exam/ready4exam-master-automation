<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
  <title>Ready4Exam — Admin Control Center</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme:{
        extend:{
          fontFamily:{sans:['Inter','sans-serif']},
          colors:{'cbse-blue':'#1a3e6a','accent-gold':'#ffb703'}
        }
      }
    }
  </script>

  <style>
    /* Custom scrollbar for a cleaner look */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #f8fafc; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    
    .status-badge {
      display: inline-flex;
      align-items: center;
      padding: 0.125rem 0.625rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
    }
  </style>
</head>

<body class="bg-slate-50 min-h-screen font-sans antialiased text-slate-900">

  <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-cbse-blue rounded-xl flex items-center justify-center shadow-lg shadow-blue-100">
            <span class="text-white font-black text-2xl">R</span>
        </div>
        <div>
          <h1 class="text-lg font-black text-cbse-blue tracking-tighter uppercase leading-none">
              Ready4Exam
          </h1>
          <p class="text-[10px] font-bold text-accent-gold uppercase tracking-[0.2em]">Management Suite</p>
        </div>
      </div>
      
      <div class="flex items-center gap-6">
        <div class="text-right hidden md:block">
            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Logged in as</p>
            <p id="current-admin-email" class="text-sm font-bold text-slate-700 italic"></p>
        </div>
        <button id="logout-btn" class="px-5 py-2.5 bg-slate-900 text-white rounded-xl font-bold text-xs uppercase hover:bg-slate-800 transition-all">
          Sign Out
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-10">

    <div class="grid grid-cols-1 lg:grid-cols-4 gap-6 mb-10">
        <div class="lg:col-span-3 bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
            <label class="text-[10px] font-black uppercase text-slate-400 mb-3 block tracking-widest">Manual Student Lookup</label>
            <div class="flex flex-col md:flex-row gap-3">
                <input id="filter-email" type="text" 
                       class="flex-1 bg-slate-50 border border-slate-200 rounded-2xl px-5 py-3.5 text-sm focus:ring-2 focus:ring-cbse-blue outline-none transition-all" 
                       placeholder="Search by student email (e.g. randhir885@gmail.com)...">
                <div class="flex gap-2">
                  <button id="apply-filters" class="bg-cbse-blue text-white px-8 py-3.5 rounded-2xl font-bold text-sm shadow-md hover:shadow-lg active:scale-95 transition-all">Search</button>
                  <button id="clear-filters" class="bg-slate-100 text-slate-600 px-6 py-3.5 rounded-2xl font-bold text-sm hover:bg-slate-200 transition-all">Reset</button>
                </div>
            </div>
        </div>
        
        <div class="bg-cbse-blue p-6 rounded-3xl shadow-xl flex flex-col justify-center border border-cbse-blue relative overflow-hidden">
            <div class="absolute -right-4 -bottom-4 w-24 h-24 bg-white/10 rounded-full blur-2xl"></div>
            
            <p class="text-blue-200 text-[10px] font-black uppercase tracking-widest mb-1">Loaded Users</p>
            <h3 class="text-white font-black text-3xl" id="results-count">0</h3>
            <button id="refresh-btn" class="text-blue-300 text-[11px] font-bold mt-3 flex items-center gap-1 hover:text-white transition-colors">
              <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
              Force Sync Database
            </button>
        </div>
    </div>

    <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left">
          <thead class="bg-slate-50 border-b border-slate-100">
            <tr class="text-[10px] font-black uppercase text-slate-400 tracking-[0.15em]">
              <th class="px-8 py-6">Student Identity</th>
              <th class="px-8 py-6">Expiry Override</th>
              <th class="px-8 py-6">Class Access (Toggles)</th>
              <th class="px-8 py-6">Stream Allocation</th>
              <th class="px-8 py-6 text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="users-tbody" class="divide-y divide-slate-50">
            <tr>
              <td colspan="5" class="py-24 text-center">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-slate-200 border-t-cbse-blue mb-4"></div>
                <p class="text-slate-400 font-bold text-sm">Initializing Firebase Services...</p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      
      <div id="empty-state" class="hidden py-32 text-center bg-white">
          <div class="bg-slate-50 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-6">
              <svg class="w-10 h-10 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
              </svg>
          </div>
          <h3 class="text-slate-800 font-black text-lg">No Results Found</h3>
          <p class="text-slate-400 text-sm max-w-xs mx-auto mt-2 font-medium">Try searching for a full email address or click Reset to view all users.</p>
      </div>
    </div>

  </main>

  <script type="module" src="./admin.js"></script>
</body>
</html>
