<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
  <title>Ready4Exam — Admin Dashboard</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme:{
        extend:{
          fontFamily:{sans:['Inter','sans-serif']},
          colors:{'cbse-blue':'#1a3e6a','accent-gold':'#ffb703'}
        }
      }
    }
  </script>

  <!-- ✅ Correct path (admin.css is in same folder as admin.html) -->
  <link rel="stylesheet" href="./admin.css">
</head>

<body class="bg-gray-100 min-h-screen">

  <!-- HEADER -->
  <header class="bg-white shadow">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-extrabold text-cbse-blue">
        Ready4Exam <span class="text-accent-gold">Admin</span>
      </h1>
      <div class="flex items-center gap-4">
        <span id="current-admin-email" class="text-sm text-gray-600"></span>
        <button id="logout-btn" class="px-4 py-2 rounded bg-red-600 text-white hover:bg-red-700">
          Logout
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="max-w-7xl mx-auto px-6 py-8">

    <h2 class="text-xl font-bold mb-4">User Management</h2>

    <!-- FILTERS -->
    <div class="bg-white p-4 rounded shadow mb-6">
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">

        <div>
          <label class="text-sm font-semibold">Search by Email</label>
          <input id="filter-email" class="mt-1 w-full border rounded px-3 py-2" placeholder="user@example.com">
        </div>

        <div>
          <label class="text-sm font-semibold">Filter by Class</label>
          <select id="filter-class" class="mt-1 w-full border rounded px-3 py-2">
            <option value="">All</option>
            <option value="6">Class 6</option>
            <option value="7">Class 7</option>
            <option value="8">Class 8</option>
            <option value="9">Class 9</option>
            <option value="10">Class 10</option>
            <option value="11">Class 11</option>
            <option value="12">Class 12</option>
          </select>
        </div>

        <div>
          <label class="text-sm font-semibold">Filter by Stream</label>
          <select id="filter-stream" class="mt-1 w-full border rounded px-3 py-2">
            <option value="">All</option>
            <option value="science">Science</option>
            <option value="commerce">Commerce</option>
            <option value="arts">Arts</option>
          </select>
        </div>

      </div>

      <div class="mt-4 flex gap-3">
        <button id="apply-filters" class="px-4 py-2 bg-cbse-blue text-white rounded hover:bg-blue-700">
          Apply Filters
        </button>
        <button id="clear-filters" class="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300">
          Clear
        </button>

        <div class="ml-auto flex gap-2 items-center">
          <label class="text-sm">Page Size:</label>
          <select id="page-size" class="border rounded px-2 py-1">
            <option>10</option>
            <option selected>20</option>
            <option>50</option>
          </select>
        </div>
      </div>
    </div>

    <!-- RESULTS -->
    <div class="bg-white rounded shadow overflow-x-auto">
      <table class="min-w-full text-sm">
        <thead class="bg-gray-100 text-gray-700 uppercase text-xs">
          <tr>
            <th class="px-4 py-3 text-left">Email</th>
            <th class="px-4 py-3 text-left">Role</th>
            <th class="px-4 py-3 text-left">Signup Date</th>
            <th class="px-4 py-3 text-left">Paid Classes</th>
            <th class="px-4 py-3 text-left">Streams</th>
            <th class="px-4 py-3 text-left">Actions</th>
          </tr>
        </thead>
        <tbody id="users-tbody"></tbody>
      </table>

      <div class="p-4 flex justify-between items-center bg-gray-50 border-t">
        <button id="prev-page" class="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300">
          Previous
        </button>

        <span id="results-count" class="text-gray-600 text-sm"></span>

        <button id="next-page" class="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300">
          Next
        </button>
      </div>
    </div>

  </main>

  <!-- FOOTER -->
  <footer class="text-center py-6 text-gray-500 text-sm">
    Ready4Exam Admin Panel · © 2025
  </footer>

  <!-- ✅ Correct path (admin.js is in same folder as admin.html) -->
  <script type="module" src="./admin.js"></script>

</body>
</html>
